name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            windows-app/package-lock.json

      - name: 웹 의존성 설치
        run: npm ci

      - name: 시뮬레이션 검사
        run: npm test

      - name: 웹 빌드
        run: npm run build

      - name: Windows 의존성 설치
        run: npm ci --prefix windows-app

      - name: 휴대용 EXE 빌드
        run: npm run build --prefix windows-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: EXE 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Doran-Windows-x64
          path: windows-app/release/*.exe
          if-no-files-found: error
          retention-days: 30
